[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-qa-toolkit"
version = "0.1.0"
description = "Offline, deterministic QA for image/video annotation datasets: COCO, YOLO, Pascal VOC, Labelbox, SuperAnnotate and Roboflow readers, structural checks, annotator agreement (Cohen's kappa, IoU box matching) and quality reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sherif Olabode" }]
keywords = ["annotation", "labelling", "quality-assurance", "computer-vision", "coco", "yolo", "kappa", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
annoqa = "annotation_qa_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Sharif899/annotation-qa-toolkit"
Repository = "https://github.com/Sharif899/annotation-qa-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
